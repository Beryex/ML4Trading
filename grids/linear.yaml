# Per-fold grid for `linear` (python -m ml4trading.train --method linear --grid grids/linear.yaml).
# alpha_ratio: the penalty as a fraction of the fold's alpha_max -- the decades of
#   scikit-learn ElasticNetCV's default path (eps = 1e-3).
# l1_ratio: a subset of the values the scikit-learn ElasticNetCV documentation suggests.
model.alpha_ratio: [0.001, 0.01, 0.1]
model.l1_ratio: [0.1, 0.5, 0.9]
